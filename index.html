<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moses Play World</title>
<style>
:root{--bg:#fff7e0;--ink:#2b2b2b;--card:#fff;--btn:#ffd54a;--on:#ff8a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2518;--ink:#f4f0e4;--card:#3a3322;--btn:#8a6d12;--on:#c55a14}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;touch-action:manipulation}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;font-size:16px;border:0;border-radius:14px;background:var(--btn);color:var(--ink);padding:10px 12px;margin:3px;min-height:46px}
button.on{background:var(--on);color:#fff}
#top,#ctl{display:flex;flex-wrap:wrap;justify-content:center}
#ttl{margin-left:auto;align-self:center;font-weight:800;font-size:20px;color:var(--on);padding:0 10px;white-space:nowrap}
#cw{flex:1;position:relative;min-height:0}#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}#zb{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column}#zb button{width:50px;height:50px;font-size:28px;padding:0;opacity:.92}
#pal{display:flex;overflow-x:auto;gap:6px;padding:4px 6px}
#pal button{flex:none;padding:4px;width:64px;height:64px}
#pal img,.g img{max-width:100%;max-height:100%;object-fit:contain}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:5}
.modal[hidden]{display:none}
.card{background:var(--card);border-radius:18px;padding:14px;width:min(92vw,440px);max-height:90vh;overflow:auto;text-align:center}
#pv{max-width:100%;max-height:240px;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.g{position:relative;height:84px;padding:4px}
.g .x{position:absolute;top:-4px;right:-4px;min-height:0;width:26px;height:26px;padding:0;background:#e55;color:#fff}
.lbl{display:inline-block;background:var(--btn);border-radius:14px;padding:12px;margin:3px}
select,input[type=text]{font-size:16px;padding:8px;border-radius:10px;margin:4px}
small{opacity:.75}
</style></head><body><div id="app">
<div id="top"><button data-m="build" class="on">🔨 Build</button><button data-m="drive">🚗 Drive</button><button id="add">📸 New toy</button><button id="gar">🏠 Garage</button><div id="ttl">Moses Play World</div></div>
<div id="cw"><canvas id="cv"></canvas><div id="zb"><button data-a="zi">+</button><button data-a="zo">−</button></div></div>
<div id="ctl"></div><div id="pal"></div></div>

<div class="modal" id="am" hidden><div class="card">
<b>Add a toy or a drawing</b><br>
<label class="lbl">📷 Take photo<input type="file" id="f1" accept="image/*" capture="environment" hidden></label>
<label class="lbl">🖼️ Pick photo<input type="file" id="f2" accept="image/*" hidden></label>
<div id="edit" hidden>
<canvas id="pv"></canvas><br><small>Tap the background in the picture to remove it. Toys should face right.</small><br>
<label>Cut-out strength <input type="range" id="tol" min="10" max="140" value="55"></label><br>
<label><input type="checkbox" id="car" checked> Cartoon look</label><br>
<select id="kind"><option value="vehicle">🚗 Vehicle</option><option value="building">🏠 Building</option><option value="tree">🌳 Tree</option><option value="lake">💧 Lake</option><option value="boat">⛵ Boat</option></select>
<input type="text" id="nm" placeholder="Name" size="12"><br>
<button id="save" class="on">✅ Save</button></div>
<button id="acl">Close</button></div></div>

<div class="modal" id="gm" hidden><div class="card"><b>🏠 My Garage</b><br><small>Tap a vehicle to drive it. ✕ deletes your own toys.</small>
<div class="grid" id="gg"></div><button id="gcl">Close</button></div></div>

<script>

[['v0','vehicle','🚗',1],['v1','vehicle','🚚',1],['v2','vehicle','🚜',1],['v3','vehicle','🚌',1],['b0','building','🏠'],['b1','building','🏢'],['b2','building','🏫'],['b3','building','🏰'],['t0','tree','🌳'],['t1','tree','🌲'],['t2','tree','🌴']].forEach(([id,k,e,f])=>{

function loop(){const n=pts.length,a=pts[0],b=pts[n-1];return n>20&&Math.hypot(a.x-b.x,a.y-b.y)<70&&Math.abs(a.z-b.z)<=25}
function closeLoop(){const a=pts[0],b=pts[pts.length-1],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<8)return;if(d>500){alert('Bring the road closer to the start first.');return}hist.push(pts.length);const k=Math.max(2,Math.round(d/S)),h=Math.atan2(a.y-b.y,a.x-b.x);for(let i=1;i<k;i++){const f=i/k;pts.push({x:b.x+(a.x-b.x)*f,y:b.y+(a.y-b.y)*f,z:b.z+(a.z-b.z)*f,h})}saveWorld()}
function mv(o,k){if(o.b&&br.length<2){o.b=0;o.t=0}const P0=o.b?br:pts,n=P0.length,L=!o.b&&loop(),pt=o.t;let tt=pt;const i=L?Math.floor(((tt%n)+n)%n):Math.min(Math.floor(tt),n-2),dz=(P0[(i+1)%n].z-P0[i].z)*o.d;tt+=o.d*k*.12*(1-dz/9);
if(L){if(tt>=n)tt-=n;if(tt<0)tt+=n}else if(tt>=n-1.01){tt=n-1.01;o.d=-1}else if(tt<=0&&o.d<0){tt=0;if(o.b){o.b=0;tt=bj}else o.d=1}

function focus(i){const[a,b]=sp(pts[i]);cam.x+=a-W/2;cam.y+=b-H/2}
function spr(it,x,y){const im=it.im;if(!im.naturalWidth)return;const h=HT[it.kind],w=Math.min(h*im.naturalWidth/im.naturalHeight,h*2);
if(it.kind!=='lake'){cx.fillStyle='#0003';cx.beginPath();cx.ellipse(x,y,w/2.4,6,0,0,7);cx.fill()}cx.drawImage(im,x-w/2,y-h,w,h)}
function carPos(o){const P0=o.b?br:pts,n=P0.length,L=!o.b&&loop();let t=o.t;if(L)t=((t%n)+n)%n;const i=Math.min(Math.floor(t),L?n-1:n-2),f=t-i,p=P0[i],q=P0[(i+1)%n],s=o.d<0?-1:1;const[a,b]=sp(p),[c,d]=sp(q);return{x:a+(c-a)*f,y:b+(d-b)*f,dx:(c-a)*s,dy:(d-b)*s,dz:q.z-p.z}}
function runs(k){const r=[];let c=null;pts.forEach((p,i)=>{if(p.k===k){if(!c){c=[];r.push(c)}c.push(i)}else c=null});return r}
function draw(){cx.setTransform(1,0,0,1,0,0);
const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#cfeeff');g.addColorStop(.3,'#a6dd7e');g.addColorStop(1,'#86c960');cx.fillStyle=g;cx.fillRect(0,0,W,H);
cx.translate(W/2,H/2);cx.scale(zm,zm);cx.translate(-W/2,-H/2);const P=pts.map(sp);cx.lineCap=cx.lineJoin='round';
cx.strokeStyle='#5a9a3a';cx.lineWidth=24;pts.forEach((p,i)=>{if(p.z>0){cx.beginPath();cx.moveTo(P[i][0],P[i][1]);cx.lineTo(P[i][0],P[i][1]+p.z);cx.stroke()}});
placed.forEach(o=>{if(items[o.id].kind==='lake'){const[x,y]=pos(o);spr(items[o.id],x,y)}});if(rv.length>1){const R=rv.map(sp),rp=()=>{cx.beginPath();R.forEach((a,i)=>i?cx.lineTo(a[0],a[1]):cx.moveTo(a[0],a[1]))};rp();cx.strokeStyle='#2b78b8';cx.lineWidth=62;cx.stroke();rp();cx.strokeStyle='#4aa8e8';cx.lineWidth=52;cx.stroke();}
const path=()=>{cx.beginPath();P.forEach((a,i)=>{if(!i||(pts[i].k==='t'&&pts[i-1].k==='t'))cx.moveTo(a[0],a[1]);else cx.lineTo(a[0],a[1])});if(loop())cx.lineTo(P[0][0],P[0][1])};
path();cx.strokeStyle='#e8d9a0';cx.lineWidth=42;cx.stroke();
path();cx.strokeStyle='#4a4a4a';cx.lineWidth=34;cx.stroke();
path();cx.strokeStyle='#fff';cx.lineWidth=3;cx.setLineDash([10,12]);cx.stroke();cx.setLineDash([]);
if(br.length>1){const B2=br.map(sp),bp=()=>{cx.beginPath();B2.forEach((a,i)=>i?cx.lineTo(a[0],a[1]):cx.moveTo(a[0],a[1]))};cx.strokeStyle='#5a9a3a';cx.lineWidth=24;br.forEach((p,i)=>{if(p.z>0){cx.beginPath();cx.moveTo(B2[i][0],B2[i][1]);cx.lineTo(B2[i][0],B2[i][1]+p.z);cx.stroke()}});bp();cx.strokeStyle='#e8d9a0';cx.lineWidth=42;cx.stroke();bp();cx.strokeStyle='#4a4a4a';cx.lineWidth=34;cx.stroke();bp();cx.strokeStyle='#fff';cx.lineWidth=3;cx.setLineDash([10,12]);cx.stroke();cx.setLineDash([])}
const RP=(r,dy)=>{cx.beginPath();r.forEach((i,j)=>j?cx.lineTo(P[i][0],P[i][1]+dy):cx.moveTo(P[i][0],P[i][1]+dy))};
const nrm=i=>{const a=P[Math.max(i-1,0)],b=P[Math.min(i+1,P.length-1)],tx=b[0]-a[0],ty=b[1]-a[1],l=Math.hypot(tx,ty)||1;return[-ty/l,tx/l]};
runs('b').forEach(r=>{if(r.length<2)return;cx.strokeStyle='#6b4423';cx.lineWidth=6;r.forEach((i,j)=>{if(j%2==0){cx.beginPath();cx.moveTo(P[i][0],P[i][1]+10);cx.lineTo(P[i][0],P[i][1]+44);cx.stroke()}});
cx.lineCap='butt';RP(r,0);cx.strokeStyle='#8b5a2b';cx.lineWidth=46;cx.stroke();RP(r,0);cx.strokeStyle='#555';cx.lineWidth=34;cx.stroke();RP(r,0);cx.strokeStyle='#fff';cx.lineWidth=3;cx.setLineDash([10,12]);cx.stroke();cx.setLineDash([]);
cx.lineCap='round';cx.strokeStyle='#d9a45b';cx.lineWidth=4;[-1,1].forEach(s=>{cx.beginPath();r.forEach((i,j)=>{const n=nrm(i),x=P[i][0]+n[0]*22*s,y=P[i][1]+n[1]*22*s-5;j?cx.lineTo(x,y):cx.moveTo(x,y)});cx.stroke()})});
const e=P[P.length-1];cx.font='34px serif';cx.fillText(loop()?'🔁':'🏁',e[0]-8,e[1]-14);
const L=placed.filter(o=>items[o.id].kind!=='lake').map(o=>{const[x,y]=pos(o);return[y,()=>spr(items[o.id],x,y)]});
[[veh||'v0',t],[veh2,t2]].forEach(([vid,tt])=>{if(!vid||!items[vid]||inTun(tt))return;const c=carPos(tt);L.push([c.y+6,()=>{const it=items[vid],im=it.im;if(!im.naturalWidth)return;const h=HT.vehicle,w=Math.min(h*im.naturalWidth/im.naturalHeight,110);
cx.save();cx.translate(c.x,c.y+6);if(c.dx<0){cx.scale(-1,1);cx.rotate(Math.atan2(c.dy,-c.dx))}else cx.rotate(Math.atan2(c.dy,c.dx));
cx.drawImage(im,-w/2,-h+4,w,h);cx.restore()}])});
if(boat&&items[boat]&&rv.length>1){const bt=items[boat],R=rv.map(sp),i=Math.min(Math.floor(tb),rv.length-2),f=tb-i,bx=R[i][0]+(R[i+1][0]-R[i][0])*f,by=R[i][1]+(R[i+1][1]-R[i][1])*f+Math.sin(tk*.08)*2,dx=(R[i+1][0]-R[i][0])*bdir,dy=(R[i+1][1]-R[i][1])*bdir;L.push([by,()=>{const im=bt.im;if(!im.naturalWidth)return;const h=HT.boat,w=Math.min(h*im.naturalWidth/im.naturalHeight,110);cx.save();cx.translate(bx,by+8);if(dx<0){cx.scale(-1,1);cx.rotate(Math.atan2(dy,-dx)*.5)}else cx.rotate(Math.atan2(dy,dx)*.5);cx.drawImage(im,-w/2,-h+6,w,h);cx.restore()}])}
L.sort((a,b)=>a[0]-b[0]).forEach(a=>a[1]());
if(br.length>1){const J=P[bj],lx=J[0],ly=J[1]-30;cx.fillStyle='#ffd54a';cx.strokeStyle='#333';cx.lineWidth=3;cx.beginPath();cx.arc(lx,ly,16,0,7);cx.fill();cx.stroke();cx.strokeStyle='#d33';cx.lineWidth=6;cx.lineCap='round';cx.beginPath();cx.moveTo(lx,ly+4);cx.lineTo(lx+(lev?12:-12),ly-12);cx.stroke();cx.fillStyle='#d33';cx.beginPath();cx.arc(lx+(lev?12:-12),ly-12,5,0,7);cx.fill()}
runs('t').forEach(r=>{if(r.length<2)return;cx.lineCap='butt';RP(r,0);cx.strokeStyle='rgba(0,0,0,.12)';cx.lineWidth=34;cx.setLineDash([4,10]);cx.stroke();cx.setLineDash([]);
[r[0],r[r.length-1]].forEach(i=>{const n=nrm(i);cx.fillStyle='#1b1b1b';cx.strokeStyle='#8d7b5c';cx.lineWidth=5;cx.beginPath();cx.ellipse(P[i][0],P[i][1],12,26,Math.atan2(-n[0],n[1]),0,7);cx.fill();cx.stroke()});cx.lineCap='round'})}
let tk=0;
function sky(){tk++;const hz=Math.round(H*.22);cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=.4;const g=cx.createLinearGradient(0,0,0,hz);g.addColorStop(0,'#7cc8ff');g.addColorStop(1,'#e4f5ff');cx.fillStyle=g;cx.fillRect(0,0,W,hz);
const mt=(col,amp,sp,par,ph)=>{cx.fillStyle=col;cx.beginPath();cx.moveTo(0,hz);for(let x=0;x<=W+20;x+=16){const u=(x+cam.x*par)/sp,h=amp*(.35+.65*(1-Math.abs(Math.sin(u+ph)))*(.7+.3*Math.sin(u*.37+ph)));cx.lineTo(x,hz-h)}cx.lineTo(W+20,hz);cx.fill()};
mt('#a9c2dc',hz*.9,60,.04,0);mt('#7fa6b8',hz*.6,40,.1,2);
const c=(a,b,r)=>{cx.beginPath();cx.arc(a,b,r,0,7);cx.fill()};cx.fillStyle='#fff';
for(let i=0;i<6;i++){const w=W+300,x=(((i*260+tk*.25-cam.x*.03)%w)+w)%w-150,y=hz*(.12+.5*((i*37)%10)/10);c(x,y,16);c(x+18,y-8,20);c(x+40,y,16);c(x+20,y+4,18)}
cx.globalAlpha=1}
function frame(){if(mode==='drive'&&going){mv(t,1);if(veh2)mv(t2,.85);if(boat&&rv.length>1){tb+=bdir*.1;if(tb>=rv.length-1.01){tb=rv.length-1.01;bdir=-1}if(tb<=0){tb=0;bdir=1}}

const c=carPos(t);cam.x+=(c.x+cam.x-W/2-cam.x)*.12;cam.y+=(c.y+cam.y-H/2-cam.y)*.12}
draw();sky();requestAnimationFrame(frame)}
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W;cv.height=H}
addEventListener('resize',rs);
let dn=null;
cv.onpointerdown=e=>{dn={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,m:false};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>8)dn.m=true;if(dn.m){cam.x=dn.cx-dx/zm;cam.y=dn.cy-dy/zm}};
cv.onpointerup=e=>{if(dn&&!dn.m){if(mode==='build')tap(e);else levTap(e)}dn=null};
function tap(e){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left-W/2)/zm+W/2,y=(e.clientY-r.top-H/2)/zm+H/2;
if(tool==='erase'){let b=-1,bd=3600;placed.forEach((o,k)=>{const[a,c]=pos(o);const d=(a-x)**2+(c-40-y)**2;if(d<bd){bd=d;b=k}});if(b>=0){placed.splice(b,1);saveWorld()}return}
if(target==='branch'&&!br.length){let bi=0,bd=1e12;pts.forEach((p,i)=>{const[a,b]=sp(p);const d=(a-x)**2+(b-y)**2;if(d<bd){bd=d;bi=i}});if(bd<50*50&&bi>1&&bi<pts.length-3){bj=bi;const p=pts[bi];br=[{x:p.x,y:p.y,z:p.z,h:p.h}];rst();saveWorld()}ui();return}if(target==='river'&&!rv.length){rv=[{x:x+cam.x,y:(y+cam.y)/Y,z:0,h:Math.PI/2}];saveWorld();ui();return}if(!sel)return;let bi=0,bd=1e12;pts.forEach((p,i)=>{const[a,b]=sp(p);const d=(a-x)**2+(b-y)**2;if(d<bd){bd=d;bi=i}});
const kk=pts[bi].k,lk=items[sel].kind==='lake',md=kk==='b'&&lk?0:kk==='t'?62:lk?70:30;if(bd<md*md)return;if(br.some(p=>{const[a,b]=sp(p);return(a-x)**2+(b-y)**2<30*30}))return;const[a,b]=sp(pts[bi]);placed.push({id:sel,i:bi,dx:x-a,dy:y-b});saveWorld()}
function ui(){document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
const B=(a,l,on)=>`<button data-a="${a}"${on?' class="on"':''}>${l}</button>`;
$('#ctl').innerHTML=mode==='build'?B('tr','🛣️ Road',target==='road')+B('tv','🌊 River',target==='river')+B('tb','🔀 Split',target==='branch')+(target==='branch'?(br.length?'':'<small>Tap the road where the side road splits</small>')+B('U','⬆️ Hill up')+B('D','⬇️ Hill down')+B('S','➡️ Straight')+B('L','↰ Left')+B('R','↱ Right')+B('undo','↩️ Undo'):target==='river'?(rv.length?'':'<small>Tap the map to start the river</small>')+B('S','➡️ Straight')+B('L','↰ Left')+B('R','↱ Right')+B('undo','↩️ Undo'):B('U','⬆️ Hill up')+B('D','⬇️ Hill down')+B('S','➡️ Straight')+B('L','↰ Left')+B('R','↱ Right')+B('B','🌉 Bridge',st==='b')+B('T','⛰️ Tunnel',st==='t')+B('close','🔗 Close loop')+B('undo','↩️ Undo'))+B('erase','🧽 Erase',tool==='erase'):B('go',going?'⏸ Stop':'▶️ Go!')+B('re','🔄 Restart')+(br.length>1?B('lev',lev?'🔀 Lever: side road':'🔀 Lever: main road'):'')+B('s0','1️⃣ Car 1',!slot)+B('s1','2️⃣ Car 2',slot==1)+(veh2?B('x2','✖ Remove car 2'):'')+(boat?B('xb','✖ Remove boat'):'')+(boat&&rv.length<2?'<small>Build a river for the boat</small>':'')+(slot&&!veh2?'<small>Pick car 2 below</small>':'');
const ks=mode==='build'?['building','tree','lake']:['vehicle','boat'];
$('#pal').innerHTML=Object.values(items).filter(i=>ks.includes(i.kind)).map(i=>`<button data-i="${i.id}"${(mode==='build'?sel===i.id&&tool!=='erase':(i.kind==='boat'?boat===i.id:(slot?veh2:veh)===i.id))?' class="on"':''}><img src="${i.url}"></button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.m){mode=b.dataset.m;going=false;rst();if(mode==='drive'){focus(0)}else focus(pts.length-1);ui()}
else if(b.dataset.i){if(mode==='build'){sel=b.dataset.i;tool=null}else if(items[b.dataset.i].kind==='boat')boat=b.dataset.i;else if(slot)veh2=b.dataset.i;else veh=b.dataset.i;ui()}
else if(b.dataset.a){const a=b.dataset.a;
if('UDSLRBT'.includes(a)&&a.length==1){if(target==='river'){if(rv.length&&'LRS'.includes(a))addR(a)}else if(target==='branch'){if(br.length&&'UDSLR'.includes(a))addBr(a)}else if(a==='B'||a==='T')st=st===a.toLowerCase()?0:a.toLowerCase();else{add(a);focus(pts.length-1)}saveWorld();tool=null}
else if(a==='undo'&&target==='branch'){if(br.length>8)br.length-=8;else br=[];rst();saveWorld()}else if(a==='undo'&&target==='river'){if(rv.length>8)rv.length-=8;else rv=[];saveWorld()}else if(a==='undo'){const n=hist.length?pts.length-hist.pop():8;if(pts.length-n>=9){pts.length-=n;if(bj>=pts.length-2)br=[];placed=placed.filter(o=>o.i<pts.length);focus(pts.length-1);saveWorld()}}
else if(a==='erase')tool=tool==='erase'?null:'erase';
else if(a==='go'){going=!going}
else if(a==='re'){rst();going=false;focus(0)}else if(a==='s0')slot=0;else if(a==='s1')slot=1;else if(a==='x2'){veh2=null;slot=0}else if(a==='xb')boat=null;else if(a==='close')closeLoop();else if(a==='tr')target='road';else if(a==='tv')target='river';else if(a==='tb')target='branch';else if(a==='lev')lev=lev?0:1;else if(a==='zi')zm=Math.min(1.8,zm*1.25);else if(a==='zo')zm=Math.max(.3,zm/1.25);
ui()}});
/* Garage */
function garage(){$('#gg').innerHTML=Object.values(items).map(i=>`<button class="g" data-g="${i.id}"><img src="${i.url}">${custom.some(c=>c.id===i.id)?`<button class="x" data-x="${i.id}">✕</button>`:''}</button>`).join('')}
$('#gar').onclick=()=>{garage();$('#gm').hidden=false};$('#gcl').onclick=()=>$('#gm').hidden=true;
$('#gg').onclick=e=>{const x=e.target.closest('[data-x]'),g=e.target.closest('[data-g]');
if(x){e.stopPropagation();const id=x.dataset.x;custom=custom.filter(c=>c.id!==id);delete items[id];placed=placed.filter(o=>o.id!==id);if(veh===id)veh='v0';if(veh2===id)veh2=null;if(boat===id)boat=null;if(sel===id)sel='b0';saveItems();saveWorld();garage();ui()}
else if(g&&items[g.dataset.g].kind==='boat'){boat=g.dataset.g;mode='drive';rst();going=false;focus(0);$('#gm').hidden=true;ui()}else if(g&&items[g.dataset.g].kind==='vehicle'){if(slot)veh2=g.dataset.g;else veh=g.dataset.g;mode='drive';rst();going=false;focus(0);$('#gm').hidden=true;ui()}};
/* Photo to cartoon */
let base=null,bg=null,res=null;
$('#add').onclick=()=>$('#am').hidden=false;$('#acl').onclick=()=>$('#am').hidden=true;
['f1','f2'].forEach(id=>$('#'+id).onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,240/Math.max(im.width,im.height));
base=document.createElement('canvas');base.width=Math.round(im.width*s);base.height=Math.round(im.height*s);base.getContext('2d').drawImage(im,0,0,base.width,base.height);bg=null;$('#edit').hidden=false;run()};im.src=URL.createObjectURL(f);e.target.value=''});
function run(){const w=base.width,h=base.height,d=base.getContext('2d').getImageData(0,0,w,h),a=d.data;
if(!bg){let s=[0,0,0],n=0;[[0,0],[w-6,0],[0,h-6],[w-6,h-6]].forEach(([x0,y0])=>{for(let y=y0;y<y0+6;y++)for(let x=x0;x<x0+6;x++){const i=(y*w+x)*4;s[0]+=a[i];s[1]+=a[i+1];s[2]+=a[i+2];n++}});bg=s.map(v=>v/n)}
const tol=+$('#tol').value,o=new Uint8ClampedArray(a),seen=new Uint8Array(w*h),st=[];
for(let x=0;x<w;x++){st.push(x,(h-1)*w+x)}for(let y=0;y<h;y++){st.push(y*w,y*w+w-1)}
while(st.length){const k=st.pop();if(seen[k])continue;seen[k]=1;const i=k*4;
if(Math.hypot(a[i]-bg[0],a[i+1]-bg[1],a[i+2]-bg[2])<tol){o[i+3]=0;const x=k%w,y=(k/w)|0;if(x>0)st.push(k-1);if(x<w-1)st.push(k+1);if(y>0)st.push(k-w);if(y<h-1)st.push(k+w)}}
if($('#car').checked)for(let i=0;i<o.length;i+=4){if(!o[i+3])continue;const m=(o[i]+o[i+1]+o[i+2])/3;for(let c=0;c<3;c++){const v=m+(o[i+c]-m)*1.4;o[i+c]=Math.max(0,Math.min(255,Math.round(v/48)*48))}}
const c1=document.createElement('canvas');c1.width=w;c1.height=h;c1.getContext('2d').putImageData(new ImageData(o,w,h),0,0);
const sil=document.createElement('canvas');sil.width=w;sil.height=h;const sg=sil.getContext('2d');sg.drawImage(c1,0,0);sg.globalCompositeOperation='source-in';sg.fillStyle='#222';sg.fillRect(0,0,w,h);
res=document.createElement('canvas');res.width=w+12;res.height=h+12;const r=res.getContext('2d');
for(let k=0;k<8;k++)r.drawImage(sil,6+Math.cos(k*Math.PI/4)*3,6+Math.sin(k*Math.PI/4)*3);r.drawImage(c1,6,6);
const pv=$('#pv');pv.width=res.width;pv.height=res.height;pv.getContext('2d').drawImage(res,0,0)}
$('#tol').oninput=()=>base&&run();$('#car').onchange=()=>base&&run();
$('#pv').onclick=e=>{const r=e.target.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*res.width/r.width)-6,y=Math.round((e.clientY-r.top)*res.height/r.height)-6;
if(x<0||y<0||x>=base.width||y>=base.height)return;const p=base.getContext('2d').getImageData(x,y,1,1).data;bg=[p[0],p[1],p[2]];run()};
$('#save').onclick=()=>{const d=res.getContext('2d').getImageData(0,0,res.width,res.height),a=d.data;let x0=res.width,y0=res.height,x1=0,y1=0;
for(let y=0;y<res.height;y++)for(let x=0;x<res.width;x++)if(a[(y*res.width+x)*4+3]>20){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
if(x1<=x0||y1<=y0){alert('Nothing left - lower the cut-out strength.');return}
const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(res,-x0,-y0);
const kind=$('#kind').value,id='c'+Date.now(),name=$('#nm').value||'My toy';
custom.push({id,kind,name,url:o.toDataURL('image/png')});mk(id,kind,name,custom[custom.length-1].url);saveItems();
if(kind==='boat'){boat=id;mode='drive';rst();going=false;focus(0)}else if(kind==='vehicle'){if(slot)veh2=id;else veh=id;mode='drive';rst();going=false;focus(0)}else{sel=id;tool=null;mode='build'}
$('#edit').hidden=true;$('#nm').value='';$('#am').hidden=true;ui()};
rs();focus(pts.length-1);ui();frame();
</script></body></html>
